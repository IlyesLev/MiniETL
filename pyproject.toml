[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-etl"
version = "0.1.0"
description = "A modular ETL pipeline"
requires-python = ">=3.10"
dependencies = [
    "PyYAML",
    "SQLAlchemy",
    "python-dotenv",
]

[tool.setuptools.packages.find]
where = ["src"]
